# One-time timer: on 12.11.2026 at 09:00 Israel time (07:00 UTC) it swaps the
# "coming soon" 12-decisions guide button for the live one prepared on the
# guide-launch branch. Safe to run again: it stops if the button is already live.
name: Guide launch

on:
  schedule:
    - cron: '45 6 12 11 *'   # starts early, then waits for 07:00 UTC
    - cron: '30 7 12 11 *'   # backup run in case the first one is skipped
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show the change, do not publish'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Stop if the guide is already live or the date is wrong
        id: check
        run: |
          if ! grep -q 'בקרוב · מדריך חדש' index.html; then echo "already live"; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y)" != "2026" ]; then echo "not 2026"; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=yes" >> "$GITHUB_OUTPUT"

      - name: Wait until 09:00 Israel time
        if: steps.check.outputs.go == 'yes' && github.event_name == 'schedule'
        run: |
          target=$(date -u -d '07:00' +%s); now=$(date -u +%s)
          if [ "$now" -lt "$target" ]; then sleep $((target - now)); fi

      - name: Swap in the live button
        if: steps.check.outputs.go == 'yes'
        run: |
          git diff "$(git merge-base HEAD origin/guide-launch)" origin/guide-launch -- index.html | git apply --index
          git --no-pager diff --cached --stat
          git --no-pager diff --cached | head -40

      - name: Publish
        if: steps.check.outputs.go == 'yes' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Shatsky Eylon"
          git config user.email "shatsky.eylon@gmail.com"
          git commit -m "Launch the 12-decisions guide button (scheduled)"
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
